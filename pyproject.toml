[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "big-portfolio-optimisation"
version = "0.1.0"
description = "Configuration-driven portfolio optimisation and risk analysis using MOSEK Fusion"
authors = [
    { name = "Tarun Chandramouli" },
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "portfolio-optimisation",
    "mosek",
    "convex-optimisation",
    "quantitative-finance",
    "mean-variance",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "mosek>=11.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "requests>=2.32",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[project.scripts]
portfolio-analytics = "big_portfolio.cli:main"

# Restrict package discovery to the src layout
[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "mosek: requires a working MOSEK licence",
]